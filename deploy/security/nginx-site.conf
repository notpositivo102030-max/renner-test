# Hardened NGINX vhost template for the legacy PHP application.
# Replace example.com, certificate paths, root and PHP-FPM socket before use.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=public_forms:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;
    root /var/www/renner-test;
    index index.php index.html;

    server_tokens off;
    autoindex off;
    client_max_body_size 2m;
    limit_conn per_ip_conn 20;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Download-Options "noopen" always;

    location ~* /(?:\.env|.*\.(?:bak|backup|conf|config|db|ini|log|old|sql|sqlite|sqlite3|swp|tmp))$ {
        return 404;
    }

    location ~* ^/(?:app|config|docs|deploy|\.git|\.github)/ {
        return 404;
    }

    location = /admin/login.php {
        limit_req zone=admin_login burst=5 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm-renner.sock;
    }

    location ^~ /login/ {
        limit_req zone=public_forms burst=20 nodelay;
        try_files $uri $uri/ /login/index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 30s;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 30s;
        fastcgi_pass unix:/run/php/php-fpm-renner.sock;
    }
}
