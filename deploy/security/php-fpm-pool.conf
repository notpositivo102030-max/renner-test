; Hardened PHP-FPM pool template. Adjust user/group, paths and capacity.
[renner]
user = www-data
group = www-data
listen = /run/php/php-fpm-renner.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 30s
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_value[log_errors] = on
php_admin_value[open_basedir] = /var/www/renner-test:/var/lib/renner-test:/tmp
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_samesite] = Lax
php_admin_value[session.use_strict_mode] = 1
php_admin_value[upload_tmp_dir] = /var/lib/renner-test/tmp
php_admin_value[error_log] = /var/log/php-fpm/renner-error.log
